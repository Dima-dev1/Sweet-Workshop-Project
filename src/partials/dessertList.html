<!DOCTYPE html>
<html lang="uk">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="../css/dessertList.css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/izitoast/dist/css/iziToast.min.css">
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=Inter:wght@400;600&display=swap"
		rel="stylesheet" />
	<script src="https://cdn.jsdelivr.net/npm/izitoast/dist/js/iziToast.min.js" defer></script>
	<title>DessertList</title>

</head>

<body>
	<div class="loader is-hidden">
		<div class="spinner"></div>
	</div>
	<section id="dessert-section">
		<div class="dessert-container">

			<h2 class="dessert-title">Солодощі</h2>
			<p class="dessert-subtitle">Спробуйте наші смачні десерти, які вас здивують!</p>

			<div class="categories-filter-wrapper">
				<select class="categories-select">
					<option value="">Всі десерти</option>
				</select>

				<ul class="container-categories-btn">
					<li>
						<button class="category-btn active" data-id="">Всі десерти</button>
					</li>
				</ul>
			</div>

			<ul class="dessert-list" id="dessert-id"></ul>

			<button class="load-more-btn">Завантажити ще</button>

		</div>
	</section>


</body>

</html>
