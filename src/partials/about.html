<section class="about" aria-labelledby="about-title" id="about">
    <div class="container about__container">
        <div class="about__intro">
            <h2 class="about__title" id="about-title">Про нас</h2>
            <p class="about__description">
                У нашій 'Солодкій Майстерні' ми створюємо неповторні солодкі шедеври, що приносять радість та
                задоволення. Наша місія — пропонувати високоякісні десерти, які поєднують у собі вишуканий смак, свіжі
                інгредієнти та естетичний вигляд.
            </p>
        </div>

        <div class="about__gallery-wrapper">

            <div class="about__slider-container">

                    <div class="swiper-wrapper">
                    
                        <div class="swiper-slide about__slide">
                            <picture>
                                <source media="(min-width: 1200px)"
                                    srcset="./img/about/desktop/image1-desktop-1x.png 1x, ./img/about/desktop/image1-desktop-2x.png 2x">
                    
                                <source media="(min-width: 768px)"
                                    srcset="./img/about/tablet/image1-tablet-1x.png 1x, ./img/about/tablet/image1-tablet-2x.png 2x">
                    
                                <img src="./img/about/mobile/image1-mobile-1x.png"
                                    srcset="./img/about/mobile/image1-mobile-1x.png 1x, ./img/about/mobile/image1-mobile-2x.png 2x"
                                    alt="Приготування десертів у майстерні" />
                            </picture>
                        </div>
                    
                        <div class="swiper-slide about__slide">
                            <picture>
                                <source media="(min-width: 1200px)"
                                    srcset="./img/about/desktop/image2-desktop-1x.png 1x, ./img/about/desktop/image2-desktop-2x.png 2x">
                                <source media="(min-width: 768px)"
                                    srcset="./img/about/tablet/image2-tablet-1x.png 1x, ./img/about/tablet/image2-tablet-2x.png 2x">
                                <img src="./img/about/mobile/image2-mobile-1x.png"
                                    srcset="./img/about/mobile/image2-mobile-1x.png 1x, ./img/about/mobile/image2-mobile-2x.png 2x"
                                    alt="Кондитери обговорюють десертне меню" />

                        </div>
                    
                        <div class="swiper-slide about__slide">
                            <picture>
                                <source media="(min-width: 1200px)"
                                    srcset="./img/about/desktop/image3-desktop-1x.png 1x, ./img/about/desktop/image3-desktop-2x.png 2x">
                                <source media="(min-width: 768px)"
                                    srcset="./img/about/tablet/image3-tablet-1x.png 1x, ./img/about/tablet/image3-tablet-2x.png 2x">
                                <img src="./img/about/mobile/image3-mobile-1x.png"

                                    alt="Готові десерти на виставці" />
                            </picture>
                        </div>
                    
                        <div class="swiper-slide about__slide">
                            <picture>
                                <source media="(min-width: 1200px)"
                                    srcset="./img/about/desktop/image4-desktop-1x.png 1x, ./img/about/desktop/image4-desktop-2x.png 2x">
                                <source media="(min-width: 768px)"
                                    srcset="./img/about/tablet/image4-tablet-1x.png 1x, ./img/about/tablet/image4-tablet-2x.png 2x">

                                    alt="Десерти та атрибутика майстерні" />
                            </picture>
