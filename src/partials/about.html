<section class="about" aria-labelledby="about-title">
  <div class="container about__container">
    <div class="about__intro">
      <h2 class="about__title" id="about-title">Про нас</h2>
      <p class="about__description">
        У нашій 'Солодкій Майстерні' ми створюємо неповторні солодкі шедеври, що приносять радість та задоволення. Наша місія — пропонувати високоякісні десерти, які поєднують у собі вишуканий смак, свіжі інгредієнти та естетичний вигляд.
      </p>
    </div>

    <div class="about__gallery-wrapper">
      <div class="about__gallery swiper about__swiper">
        <div class="swiper-wrapper">
          <div class="swiper-slide about__slide">
            <img src="./img/about/desktop/image1-desktop-1x.png"
                 srcset="./img/about/desktop/image1-desktop-1x.png 1x, ./img/about/desktop/image1-desktop-2x.png 2x"
                 alt="Приготування десертів у майстерні" />
          </div>
          <div class="swiper-slide about__slide">
            <img src="./img/about/desktop/image2-desktop-1x.png"
                 srcset="./img/about/desktop/image2-desktop-1x.png 1x, ./img/about/desktop/image2-desktop-2x.png 2x"
                 alt="Кондитери обговорюють десертне меню" />
          </div>
          <div class="swiper-slide about__slide">
            <img src="./img/about/desktop/image3-desktop-1x.png"
                 srcset="./img/about/desktop/image3-desktop-1x.png 1x, ./img/about/desktop/image3-desktop-2x.png 2x"
                 alt="Готові десерти на виставці" />
          </div>
          <div class="swiper-slide about__slide">
            <img src="./img/about/desktop/image4-desktop-1x.png"
                 srcset="./img/about/desktop/image4-desktop-1x.png 1x, ./img/about/desktop/image4-desktop-2x.png 2x"
                 alt="Десерти та атрибутика майстерні" />
          </div>
        </div>
      </div>

      <button class="about__nav-button about__nav-button--prev" type="button" aria-label="Попередній слайд">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M10 13L5 8L10 3" stroke="#080C0C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <button class="about__nav-button about__nav-button--next" type="button" aria-label="Наступний слайд">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M6 13L11 8L6 3" stroke="#080C0C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

      <div class="about__pagination"></div>
    </div>
  </div>
</section>
