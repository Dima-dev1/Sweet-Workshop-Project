      <section class="about" aria-labelledby="about-title">
    <div class="container about__container">
        <div class="about__intro">
            <h2 class="about__title" id="about-title">Про нас</h2>
            <p class="about__description">
                У нашій 'Солодкій Майстерні' ми створюємо неповторні солодкі шедеври, що приносять радість та
                задоволення. Наша місія — пропонувати високоякісні десерти, які поєднують у собі вишуканий смак, свіжі
                інгредієнти та естетичний вигляд.
            </p>
        </div>

                                alt="Приготування десертів у майстерні" />
                        </div>
                        <div class="swiper-slide about__slide">
                            <img src="/Sweet-Workshop/assets/image2-desktop-1x-Cnls2f6D.png"

                                alt="Кондитери обговорюють десертне меню" />

                        <div class="swiper-slide about__slide">
                            <img src="/Sweet-Workshop/assets/image3-desktop-1x-BQLCEhf4.png"

    <form class="form-order">
      <h1 class="title-order">Оформлення замовлення</h1>
      <label class="label-order">
        Ім'я*
        <input
          class="input-order"
          type="text"
          name="user-name"
          placeholder="Вікторія"
          required
        />
        <span class="error-text" hidden>Введіть ім'я</span>
      </label>
      <label class="label-order">
        Телефон*
        <input
          class="input-order"
          type="tel"
          name="user-tel"
          placeholder="38 0_ ____"
          required
        />
        <span class="error-text" hidden
          >Номер телефону повинен містити 12 цифр</span
        >
      </label>
      <label class="label-order">
        Коментар*
        <textarea
          class="textarea-order"
          name="comment"
          resize="horizontal"
          placeholder="Ваш коментар"
          required
        ></textarea>
        <span class="error-text" hidden>Введіть коментар</span>
      </label>
      <button class="btn-order" type="submit">Надіслати заявку</button>
    </form>
